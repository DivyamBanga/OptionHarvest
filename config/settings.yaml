# OptionHarvest configuration
# ============================

# Strategy parameters -- what to sell
strategy:
  target_premium: 0.75          # desired premium per contract ($75 actual)
  option_type: "put"            # "put", "call", or "both" (strangle)
  strike_selection: "premium"   # "premium" or "delta"
  target_delta: 0.10            # used if strike_selection is "delta"
  num_contracts: 1              # how many contracts to sell
  min_open_interest: 100        # skip illiquid options
  max_bid_ask_spread: 0.50      # skip wide spreads

# Chain generation -- how to filter the options chain
chain:
  strike_range_pct: 0.10        # fetch strikes within +/- 10% of spot

# Execution parameters -- when and how to trade
execution:
  entry_time: "09:31"           # enter after 9:31 AM ET
  exit_time: "15:15"            # exit by 3:15 PM ET (before Alpaca auto-liquidation at 3:30)
  monitor_interval: 60          # poll position every 60 seconds
  fill_timeout: 120             # wait 2 min for fill before adjusting
  max_price_adjustments: 3      # adjust limit price up to 3 times

# Exit rules -- when to close a position
exit:
  stop_loss_multiplier: 2.0     # exit if option price >= 2x entry premium
  profit_target_pct: 0.50       # exit if option decays to 50% of entry
  use_stop_loss: true
  use_profit_target: true

# Risk controls -- protect the account
risk:
  max_daily_loss: 300.0         # stop trading if daily loss exceeds $300
  max_weekly_loss: 1000.0       # stop trading if weekly loss exceeds $1000
  max_position_pct: 0.05        # max 5% of equity at risk per trade
  circuit_breaker_loss_pct: 0.03  # close all if unrealized loss > 3% of equity
  circuit_breaker_qqq_move: 0.03  # close all if QQQ moves > 3% from open

# Analytics -- where to store trade logs
analytics:
  trade_log_dir: "data/trades"
