# OptionHarvest configuration
# ============================

# Data pipeline
data:
  underlying: "QQQ"
  start_date: "2020-01-01"
  storage_dir: "data/processed"

# Implied volatility model
# VIX (30-day SPX IV) is adjusted for QQQ and 0DTE term structure
iv_model:
  qqq_vix_ratio: 1.15          # QQQ is ~15% more volatile than SPX
  term_structure_0dte: 0.90     # 0DTE IV ≈ 90% of 30-day IV (normal markets)
  skew_put_slope: 1.5           # OTM puts have steeper skew (crash fear)
  skew_call_slope: 0.3          # OTM calls have mild skew

# Chain generation
chain:
  strike_range_pct: 0.10        # generate strikes within ±10% of spot
  strike_spacing: 1.0           # $1 strike intervals
  risk_free_rate: 0.05          # annual risk-free rate
  trading_hours: 6.5            # market hours per day
  entry_delay_minutes: 1        # enter 1 min after open (9:31 AM)

# Strategy parameters (used by backtester — Task 2)
strategy:
  target_premium: 1.50          # desired premium per contract ($150 actual)
  option_type: "put"            # "put", "call", or "both"
  strike_selection: "premium"   # "premium" or "delta"
  target_delta: 0.10            # used if strike_selection is "delta"
  num_contracts: 1
  use_spread: false
  spread_width: 5
  slippage: 0.05                # assumed slippage per contract ($)
  commission: 0.65              # IBKR commission per contract ($)

# Account parameters (used by backtester — Task 3)
account:
  starting_capital: 25000
  margin_model: "reg_t"         # "reg_t" or "portfolio_margin"
  max_daily_risk: 0.05          # max 5% of account at risk per day
