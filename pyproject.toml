[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optionharvest"
version = "0.2.0"
description = "Automated 0DTE QQQ option selling bot on Alpaca paper trading"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "alpaca-py>=0.30",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
dashboard = [
    "streamlit>=1.30",
    "plotly>=5.18",
]

[tool.setuptools.packages.find]
include = ["optionharvest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
